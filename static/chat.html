<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLM Observatory</title><link rel="stylesheet" href="/static/vendor/bootstrap.min.css"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/duo.css"></head><body class="duo-page chat-view"><header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><h1>LLM <strong>Observatory</strong></h1><span class="brand-caption">会話と生成の過程を、並べて観察する。</span></div></div><div class="top-actions"><span id="sessionLabel" class="session-label"></span><a class="btn btn-sm btn-outline-secondary" href="/">画面の選択</a></div></header><main class="duo-main">  <section class="chat-panel panel" aria-labelledby="chatTitle">
    <div class="chat-heading"><div><span class="eyebrow">CONVERSATION</span><h2 id="chatTitle">モデルと話す</h2></div><button id="resetButton" class="icon-button" title="新しい会話" aria-label="新しい会話">＋</button></div>
    <div id="chatMessages" class="chat-messages" aria-live="polite" aria-relevant="additions text"></div>
    <div class="duo-controls">
      <div class="generation-mode"><span class="mode-caption">開始方法</span><div class="btn-group btn-group-sm" role="group" aria-label="生成の開始方法"><input type="radio" class="btn-check" name="generationMode" id="modeAuto" autocomplete="off" checked><label class="btn btn-outline-primary" for="modeAuto">自動で進める</label><input type="radio" class="btn-check" name="generationMode" id="manualMode" autocomplete="off"><label class="btn btn-outline-primary" for="manualMode">1トークンずつ</label></div><span id="modeHint" class="mode-hint">送信すると自動で生成します</span></div>
      <div class="d-flex gap-2 align-items-center flex-wrap"><button class="btn btn-outline-primary" id="pauseButton" type="button" disabled>一時停止</button><button class="btn btn-outline-primary" id="backButton" type="button" disabled>1トークン戻す</button><button class="btn btn-outline-primary" id="stepButton" type="button" disabled>1トークン進める <kbd>Enter</kbd></button><span id="runStatus" class="run-status" role="status">入力待ち</span></div>
      <div class="compare-line"><label for="compareTemperature">比較用 Temperature B</label><input id="compareTemperature" class="form-control form-control-sm" type="number" min="0" max="2" step="0.1" value="1.3"><button id="compareButton" class="btn btn-outline-primary" type="button">同じ質問でA/B比較</button></div>
    </div>
    <details class="chat-settings"><summary>生成設定を開く</summary>        <section class="panel settings-panel"><div class="panel-heading"><h3><span class="step-number">7</span>生成設定</h3></div><fieldset id="settingsFields"><div class="range-label"><label for="temperature">Temperature</label><output id="temperatureValue">0.7</output></div><input id="temperature" class="form-range" type="range" min="0" max="2" step="0.1" value="0.7"><div class="range-endpoints"><span>安定</span><span>多様</span></div><div class="settings-row"><label for="topK">Top-K</label><input id="topK" class="form-control form-control-sm" type="number" min="0" max="100" value="20"><label for="topP">Top-P</label><input id="topP" class="form-control form-control-sm" type="number" min="0.05" max="1" step="0.05" value="0.95"></div><details><summary>詳細設定</summary><div class="detail-field"><label for="maxTokens">最大生成数</label><input id="maxTokens" class="form-control form-control-sm" type="number" min="1" max="768" value="384"></div><div class="detail-field"><label for="delay">表示間隔 (ms)</label><input id="delay" class="form-control form-control-sm" type="number" min="0" max="1000" step="20" value="80"></div><div class="detail-field"><label for="seed">乱数シード</label><input id="seed" class="form-control form-control-sm" type="number" min="0" max="2147483647" value="42"></div></details></fieldset></section></details>
    <div id="errorBox" class="alert alert-danger mx-3 mb-2" role="alert" hidden></div>
    <form id="chatForm" class="composer"><div class="model-control"><label for="modelSelect" class="control-label">モデル</label><select class="form-select" id="modelSelect"><option>接続しています…</option></select><div id="modelDescription" class="small-note">サーバーを確認しています</div></div><label class="visually-hidden" for="prompt">メッセージ</label><textarea class="form-control" id="prompt" placeholder="メッセージを入力…" rows="2" maxlength="4000" required></textarea><div class="composer-bottom"><span>Enterで送信 · Shift + Enterで改行</span><button class="btn btn-primary" type="submit" id="sendButton">送信 <span aria-hidden="true">↑</span></button><button class="btn btn-outline-danger" type="button" id="stopButton" hidden>■ 停止</button></div></form>
    <div class="chat-footer">生成内容には誤りが含まれることがあります。</div>
  </section><section class="inline-viz" aria-label="生成プロセスの可視化"><iframe id="vizFrame" title="生成プロセスの可視化" loading="eager"></iframe></section></main><script src="/static/chat.js" defer></script></body></html>
