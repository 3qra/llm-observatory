<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LLM Observatory · 画面を開く</title><link rel="stylesheet" href="/static/vendor/bootstrap.min.css"><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/duo.css"></head><body class="launch-view"><main class="launch-shell"><div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><div><h1>LLM <strong>Observatory</strong></h1><span class="brand-caption">生成の過程を、2画面で観察する。</span></div></div><div class="launch-rule"></div><p class="eyebrow">TWO SCREEN WORKSPACE</p><h2>質問を送る。<br>トークンの動きを見る。</h2><p class="launch-intro">同じセッションの2つの画面を、それぞれのモニターで開いてください。チャットの生成に合わせて、可視化画面が同期します。</p><div class="launch-cards"><a id="chatLink" class="launch-card" href="#"><span class="launch-index">01 / INPUT</span><strong>チャット画面</strong><span>モデル選択・質問・一時停止・Temperature比較</span><em>開く ↗</em></a><a id="vizLink" class="launch-card" href="#"><span class="launch-index">02 / OBSERVE</span><strong>可視化画面</strong><span>トークン・PCA・内部状態・アテンション・確率</span><em>開く ↗</em></a></div><p class="launch-note">接続ID <code id="sessionCode"></code> · 両画面で同じIDを使用します。</p><a href="/single" class="single-link">従来の1画面版を開く →</a></main><script>const id=crypto.randomUUID();document.getElementById('sessionCode').textContent=id.slice(0,8);for(const [name,path] of [['chatLink','chat'],['vizLink','viz']]){const a=document.getElementById(name);a.href=`/${path}?session=${encodeURIComponent(id)}`;a.target='_blank';a.rel='noopener';}</script></body></html>
